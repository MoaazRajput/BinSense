<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BinSense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-body">
  <nav class="navbar navbar-dark fixed-top" style="background:var(--bg-nav); border-bottom:1px solid var(--border-dark);">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <div class="logo-box"><i class="bi bi-recycle"></i></div>
        <span class="fw-bold fs-5">Bin<span class="text-green">Sense</span></span>
      </a>
      <a href="index.html" class="btn btn-outline-green btn-sm px-3">
        <i class="bi bi-arrow-left me-1"></i>Back
      </a>
    </div>
  </nav>

  <main class="auth-container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="auth-logo mx-auto mb-3">
          <i class="bi bi-recycle"></i>
        </div>
        <h4 class="fw-bold mb-1" style="color:#f8fafc;">Welcome to BinSense</h4>
        <p class="text-muted small">Sign in to access your waste dashboard</p>
      </div>

      <div id="gsi-button" class="d-flex justify-content-center"></div>

      <p id="login-error" class="text-center text-danger small mt-3 mb-0 d-none">
        Google login failed. Please try again.
      </p>

      <p class="text-center mt-5 mb-0" style="font-size:0.71rem;color:rgba(255,255,255,0.2);">
        By signing in, you agree to our
        <a href="#" style="color:rgba(255,255,255,0.35);text-decoration:none;">Terms</a>
        &amp;
        <a href="#" style="color:rgba(255,255,255,0.35);text-decoration:none;">Privacy Policy</a>
      </p>
    </div>
  </main>

  <script>
    const GOOGLE_CLIENT_ID = '1017988552793-b37m0unc42lr8ovgm1sod2fkegucel7a.apps.googleusercontent.com';

    function decodeJwtPayload(token) {
      const payload = token.split('.')[1];
      const base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64.padEnd(base64.length + (4 - base64.length % 4) % 4, '=');
      return JSON.parse(atob(padded));
    }

    function onLogin(response) {
      try {
        const payload = decodeJwtPayload(response.credential);
        localStorage.setItem('binsense_user', JSON.stringify({
          name: payload.name,
          email: payload.email,
          picture: payload.picture
        }));
        window.location.href = '/';
      } catch (error) {
        console.error('Google login error:', error);
        document.getElementById('login-error').classList.remove('d-none');
      }
    }

    function initializeGoogleSignIn() {
      if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) {
        setTimeout(initializeGoogleSignIn, 100);
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: onLogin,
        ux_mode: 'popup'
      });

      google.accounts.id.renderButton(
        document.getElementById('gsi-button'),
        {
          theme: 'filled_black',
          size: 'large',
          shape: 'pill',
          text: 'signin_with',
          width: 320
        }
      );
    }

    window.addEventListener('load', initializeGoogleSignIn);
  </script>
</body>
</html>
